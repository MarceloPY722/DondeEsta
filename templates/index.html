<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DondeEstaMi - Linea 187</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: #0f172a;
                color: #e2e8f0;
                min-height: 100vh;
            }

            .header {
                background: linear-gradient(135deg, #1e40af, #7c3aed);
                padding: 20px;
                text-align: center;
            }

            .header h1 {
                font-size: 1.5rem;
                color: #fff;
            }
            .header p {
                color: #c4b5fd;
                font-size: 0.85rem;
                margin-top: 4px;
            }

            .status-bar {
                display: flex;
                justify-content: center;
                gap: 20px;
                padding: 12px;
                background: #1e293b;
                font-size: 0.8rem;
                color: #94a3b8;
            }

            .status-dot {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #22c55e;
                margin-right: 6px;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }

            .container {
                padding: 16px;
                max-width: 600px;
                margin: 0 auto;
            }

            .section-title {
                font-size: 0.85rem;
                font-weight: 600;
                color: #64748b;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 10px;
                margin-top: 20px;
            }

            /* ALERTAS */
            .alerta-card {
                background: #451a1a;
                border: 1px solid #ef4444;
                border-radius: 10px;
                padding: 14px;
                margin-bottom: 8px;
                animation: alertaEntrar 0.4s ease-out;
            }

            @keyframes alertaEntrar {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .alerta-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .alerta-hora {
                font-size: 0.75rem;
                color: #fca5a5;
            }

            .alerta-badge {
                background: #ef4444;
                color: #fff;
                padding: 2px 8px;
                border-radius: 6px;
                font-size: 0.7rem;
                font-weight: 700;
                animation: pulse 1s infinite;
            }

            .alerta-msg {
                margin-top: 8px;
                font-size: 1rem;
                font-weight: 600;
                color: #fecaca;
            }

            /* BUSES */
            .bus-card {
                background: #1e293b;
                border-radius: 12px;
                padding: 16px;
                margin-bottom: 12px;
                border-left: 4px solid #3b82f6;
            }

            .bus-card.cerca {
                border-left-color: #ef4444;
            }

            .bus-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .bus-unidad {
                font-size: 1.3rem;
                font-weight: 700;
                color: #fff;
            }

            .bus-eta {
                font-size: 1.4rem;
                font-weight: 700;
                color: #22c55e;
            }

            .bus-card.cerca .bus-eta {
                color: #ef4444;
            }

            .bus-details {
                display: flex;
                gap: 12px;
                margin-top: 10px;
                font-size: 0.8rem;
                color: #94a3b8;
                flex-wrap: wrap;
            }

            .badge {
                padding: 3px 8px;
                border-radius: 6px;
                font-size: 0.7rem;
                font-weight: 600;
            }

            .badge-ida {
                background: #065f46;
                color: #6ee7b7;
            }
            .badge-aire {
                background: #1e3a5f;
                color: #93c5fd;
            }

            .empty-state {
                text-align: center;
                padding: 40px 20px;
                color: #64748b;
            }

            .empty-state .icon {
                font-size: 2.5rem;
                margin-bottom: 8px;
            }
            .empty-state p {
                font-size: 0.9rem;
            }

            .errors {
                margin-top: 20px;
                padding: 12px;
                background: #2d1b1b;
                border-radius: 8px;
                font-size: 0.75rem;
                color: #fca5a5;
            }

            .errors summary {
                cursor: pointer;
                font-weight: 600;
            }
            .errors pre {
                margin-top: 8px;
                white-space: pre-wrap;
            }

            .no-alertas {
                text-align: center;
                padding: 20px;
                color: #475569;
                font-size: 0.85rem;
                border: 1px dashed #334155;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>DondeEstaMi - Linea 187</h1>
            <p>Sentido IDA hacia IPS</p>
        </div>

        <div class="status-bar">
            <span><span class="status-dot"></span>Monitoreando</span>
            <span id="lastUpdate">Ultima actualizacion: --:--:--</span>
            <span id="busCount">0 buses</span>
        </div>

        <div class="container">
            <!-- ALERTAS -->
            <div class="section-title">Alertas (<= 10 min)</div>
            <div id="alertasList">
                <div class="no-alertas">Sin alertas por ahora</div>
            </div>

            <!-- BUSES EN CAMINO -->
            <div class="section-title">Buses en camino</div>
            <div id="busList">
                <div class="empty-state">
                    <div class="icon">bus</div>
                    <p>Cargando datos...</p>
                </div>
            </div>

            <!-- ERRORES -->
            <details class="errors" id="errorSection" style="display: none">
                <summary>Errores recientes</summary>
                <pre id="errorList"></pre>
            </details>
        </div>

        <script>
            async function fetchBuses() {
                try {
                    const res = await fetch("/api/buses");
                    const data = await res.json();
                    render(data);
                } catch (e) {
                    console.error("Error fetching:", e);
                }
            }

            function render(data) {
                document.getElementById("lastUpdate").textContent =
                    "Ultima actualizacion: " + (data.last_update || "--:--:--");

                const buses = data.buses || [];
                document.getElementById("busCount").textContent =
                    buses.length + " buses";

                // ALERTAS
                const alertasContainer = document.getElementById("alertasList");
                const alertas = data.alertas || [];

                if (alertas.length === 0) {
                    alertasContainer.innerHTML =
                        '<div class="no-alertas">Sin alertas por ahora</div>';
                } else {
                    let alertHtml = "";
                    alertas
                        .slice()
                        .reverse()
                        .forEach((a) => {
                            alertHtml +=
                                '<div class="alerta-card">' +
                                '<div class="alerta-top">' +
                                '<span class="alerta-hora">' +
                                a.hora +
                                "</span>" +
                                '<span class="alerta-badge">CERCA</span>' +
                                "</div>" +
                                '<div class="alerta-msg">' +
                                a.mensaje +
                                "</div>" +
                                "</div>";
                        });
                    alertasContainer.innerHTML = alertHtml;
                }

                // BUSES
                const busContainer = document.getElementById("busList");

                if (buses.length === 0) {
                    busContainer.innerHTML =
                        '<div class="empty-state">' +
                        '<div class="icon">bus</div>' +
                        "<p>No hay buses linea 187 (IDA) cercanos ahora</p>" +
                        "</div>";
                    return;
                }

                let html = "";
                buses.sort((a, b) => (a.minutos || 999) - (b.minutos || 999));

                buses.forEach((bus) => {
                    const cerca = bus.minutos !== null && bus.minutos <= 10;
                    const eta =
                        bus.minutos !== null
                            ? bus.minutos + " min"
                            : "Calculando...";

                    html +=
                        '<div class="bus-card' +
                        (cerca ? " cerca" : "") +
                        '">' +
                        '<div class="bus-top">' +
                        '<span class="bus-unidad">Unidad #' +
                        bus.unidad +
                        "</span>" +
                        '<span class="bus-eta">' +
                        eta +
                        "</span>" +
                        "</div>" +
                        '<div class="bus-details">' +
                        '<span class="badge badge-ida">IDA</span>' +
                        (bus.aire
                            ? '<span class="badge badge-aire">A/C</span>'
                            : "") +
                        "<span>" +
                        (bus.recorrido || "") +
                        "</span>" +
                        "</div>" +
                        "</div>";
                });

                busContainer.innerHTML = html;

                // ERRORES
                if (data.errores && data.errores.length > 0) {
                    document.getElementById("errorSection").style.display =
                        "block";
                    document.getElementById("errorList").textContent =
                        data.errores.join("\n");
                }
            }

            fetchBuses();
            setInterval(fetchBuses, 5000);
        </script>
    </body>
</html>
